name: livros
description: A Flutter book search app powered by the Google Books API.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  bloc: ^9.2.1
  cupertino_icons: ^1.0.9
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  http: ^1.6.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
